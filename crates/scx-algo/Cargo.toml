# Written for solidcorex.
[package]
name = "scx-algo"
description = "solidcorex layer 1: generic numerical algorithms (polynomial roots, local solvers) over scx-num"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

# Only the layer below.
[dependencies]
scx-num = { path = "../scx-num" }

# The exact truths of the polynomial tests.
[dev-dependencies]
scx-testkit = { path = "../scx-testkit" }

# `LocalSolve1d::solve_traced`, for the difftest.
[features]
trace = []

[lints]
workspace = true
