# Written for solidcorex.
[package]
name = "scx-make"
description = "solidcorex: constructors of bodies from a frame and sizes, built with their topology known, with a typed record of their faces"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scx-algo = { path = "../scx-algo" }
scx-boolean = { path = "../scx-boolean" }
scx-brep = { path = "../scx-brep" }
scx-curve = { path = "../scx-curve" }
scx-num = { path = "../scx-num" }
scx-nurbs = { path = "../scx-nurbs" }
scx-nurbs-surface = { path = "../scx-nurbs-surface" }
scx-planar = { path = "../scx-planar" }
scx-surface = { path = "../scx-surface" }

[dev-dependencies]
scx-check = { path = "../scx-check" }
scx-mass = { path = "../scx-mass" }
scx-record = { path = "../scx-record" }
scx-testkit = { path = "../scx-testkit", features = ["bodies"] }

[lints]
workspace = true
