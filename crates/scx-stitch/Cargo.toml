# Written for solidcorex.
[package]
name = "scx-stitch"
description = "Stitching sheets into one body: vertices and edges within coincidence identified"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# scx-algo's box tree, scx-curve's curves, scx-nurbs's tangent side, scx-surface's
# certified gaps; scx-mass's certified volume sign and scx-bodyq's point classification
# orient a solid (ST3).
scx-algo = { path = "../scx-algo" }
scx-bodyq = { path = "../scx-bodyq" }
scx-brep = { path = "../scx-brep" }
scx-curve = { path = "../scx-curve" }
scx-mass = { path = "../scx-mass" }
scx-num = { path = "../scx-num" }
scx-nurbs = { path = "../scx-nurbs" }
scx-surface = { path = "../scx-surface" }

[dev-dependencies]
scx-testkit = { path = "../scx-testkit", features = ["bodies"] }

[lints]
workspace = true
