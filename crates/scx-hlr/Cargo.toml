# Written for solidcorex.
[package]
name = "scx-hlr"
description = "Hidden-line removal on scx's own evaluators: views, scenes, exact silhouettes"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scx-bodyq = { path = "../scx-bodyq" }
scx-brep = { path = "../scx-brep" }
scx-curve = { path = "../scx-curve" }
scx-num = { path = "../scx-num" }
scx-planar = { path = "../scx-planar" }
scx-surface = { path = "../scx-surface" }

[dev-dependencies]
scx-nurbs = { path = "../scx-nurbs" }
scx-nurbs-surface = { path = "../scx-nurbs-surface" }
scx-testkit = { path = "../scx-testkit", features = ["bodies"] }

[lints]
workspace = true
