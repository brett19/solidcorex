# Written for solidcorex.
[package]
name = "scx-boolean"
description = "The Boolean of two bodies: union, subtraction and intersection"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scx-algo = { path = "../scx-algo" }
scx-bodyq = { path = "../scx-bodyq" }
scx-brep = { path = "../scx-brep" }
scx-curve = { path = "../scx-curve" }
scx-mass = { path = "../scx-mass" }
scx-num = { path = "../scx-num" }
scx-nurbs = { path = "../scx-nurbs" }
scx-ssi = { path = "../scx-ssi" }
scx-surface = { path = "../scx-surface" }

[dev-dependencies]
scx-check = { path = "../scx-check" }
scx-tess = { path = "../scx-tess" }
scx-testkit = { path = "../scx-testkit", features = ["bodies"] }

[lints]
workspace = true
