# Written for solidcorex.
[package]
name = "scx-surface"
description = "solidcorex layer 3: the analytic surface kinds (plane, cylinder, cone, sphere, torus) in closed form, in the pin's NURBS-compatible uv"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

# scx-curve (01's crate row) joins when a step uses it (sections, curve-surface hits);
# scx-nurbs-surface with the Nurbs arm (SU2).
[dependencies]
scx-num = { path = "../scx-num" }
scx-nurbs = { path = "../scx-nurbs" }

# The exact references the unit tests check against (layers.txt [testkit]).
[dev-dependencies]
scx-testkit = { path = "../scx-testkit" }

[lints]
workspace = true
