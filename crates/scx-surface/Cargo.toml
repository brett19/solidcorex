# Written for solidcorex.
[package]
name = "scx-surface"
description = "solidcorex layer 3: the analytic surface kinds (plane, cylinder, cone, sphere, torus) in closed form, in the pin's NURBS-compatible uv"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

# scx-curve (01's crate row): the exact pcurves (`pcurve_of`) build its 2-D kinds.
[dependencies]
scx-algo = { path = "../scx-algo" }
scx-curve = { path = "../scx-curve" }
scx-num = { path = "../scx-num" }
scx-nurbs = { path = "../scx-nurbs" }
scx-nurbs-surface = { path = "../scx-nurbs-surface" }

# The exact references the unit tests check against (layers.txt [testkit]).
[dev-dependencies]
scx-testkit = { path = "../scx-testkit" }

[lints]
workspace = true
