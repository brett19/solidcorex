# Written for solidcorex.
[package]
name = "scx-difftest"
description = "Differential tests: scx-num, scx-nurbs, scx-nurbs-surface, scx-curve, scx-surface, scx-algo and scx-p21 against the pinned solidcore: deterministic, and within tolerance of the pin"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scx-num = { path = "../scx-num" }

[dev-dependencies]
# Used by the tests only; the library holds the shared helpers.
scx-nurbs = { path = "../scx-nurbs" }
scx-nurbs-surface = { path = "../scx-nurbs-surface" }
scx-curve = { path = "../scx-curve" }
scx-surface = { path = "../scx-surface" }
scx-ssi = { path = "../scx-ssi" }
scx-algo = { path = "../scx-algo", features = ["trace"] }
# The pinned solidcore (commit 03e16c9ee766de5b9b1ced845e5149d62ff493b8), a read-only
# worktree beside this repository: `<parent>/sc-wt/scx-pin`.
solidcore = { path = "../../../sc-wt/scx-pin/solidcore/crates/solidcore" }
# The pin's Part 21 reader, units, Part 42 reader and product structure, for scx-p21's
# comparison (`t_p21`). Here only: no library depends on it.
solidcore-record = { path = "../../../sc-wt/scx-pin/solidcore/crates/solidcore-record" }
scx-p21 = { path = "../scx-p21" }
# The truth references (layers.txt [testkit]), for the exact checks of the pin defects and
# the seeded curves of `t_nurbs`.
scx-testkit = { path = "../scx-testkit", features = ["bodies"] }
# The bodies the testkit generates (`t_bodies`).
scx-brep = { path = "../scx-brep" }
# The step-4 outcome difftest (`t_slice`): the constructors scx has, and the encoding its
# run-twice check compares.
scx-make = { path = "../scx-make" }
scx-record = { path = "../scx-record" }
# The mass properties against the pin's (`t_mass`).
scx-mass = { path = "../scx-mass" }

[lints]
workspace = true
