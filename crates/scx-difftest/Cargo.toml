# Written for solidcorex.
[package]
name = "scx-difftest"
description = "Differential tests: scx-num and scx-algo against the pinned solidcore, bit for bit"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
scx-num = { path = "../scx-num" }
scx-algo = { path = "../scx-algo" }
# The pinned solidcore (commit 03e16c9ee766de5b9b1ced845e5149d62ff493b8), a read-only
# worktree beside this repository: `<parent>/sc-wt/scx-pin`.
solidcore = { path = "../../../sc-wt/scx-pin/solidcore/crates/solidcore" }

[lints]
workspace = true
