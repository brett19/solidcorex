# Written for solidcorex.
[package]
name = "scx-testkit"
description = "solidcorex truth references for tests: exact rational B-spline and NURBS evaluation, knot insertion and degree elevation, double-double analytic curves and surfaces, seeded generators"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true
# Never published: a dev-dependency only (layers.txt [testkit]). Said here, not inherited.
publish = false

[dependencies]
scx-num = { path = "../scx-num" }
# The body generators alone (`bodies`): off by default, so the geometry layers' tests, which
# all dev-depend on this crate, do not build the topology stack (research 63 §6.10).
scx-brep = { path = "../scx-brep", optional = true }
scx-curve = { path = "../scx-curve", optional = true }
scx-nurbs = { path = "../scx-nurbs", optional = true }
scx-planar = { path = "../scx-planar", optional = true }
scx-surface = { path = "../scx-surface", optional = true }

[features]
# Seeded valid and broken bodies, built through `scx-brep`'s `Draft`.
bodies = ["dep:scx-brep", "dep:scx-curve", "dep:scx-nurbs", "dep:scx-surface", "dep:scx-planar"]

[lints]
workspace = true
