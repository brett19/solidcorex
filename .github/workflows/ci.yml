# Written for solidcorex. Apache-2.0.
# Routine checks, so a builder pushes a branch and reviews only the design (docs/02-testing.md, CI).
# The toolchain comes from rust-toolchain.toml; cargo installs it on first use.
#
# Wall time is the slowest job, so the work is split to even the jobs out: `lint` (static checks),
# `tests` (the tier-1 tests, one shard per heavy crate), `difftest` (the differential suite) and
# the small cross-platform and bench-compile jobs. The same tests run as before;
# `cargo xtask tests --except ...` takes every crate no named shard does.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep panic backtraces; full debug info only slows the compile and link.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pin # lint checks scx-difftest, which links the pin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask lint # conflicts, fmt --check, clippy -D warnings, layers, headers
      - run: cargo clippy --workspace --all-targets -- -D warnings # every member, difftest too

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: surface, crates: scx-surface }
          - { name: mass, crates: scx-mass }
          - { name: ssi-record, crates: scx-ssi scx-record }
          # Every other library and test kit, the bench crate's tests and xtask's.
          - { name: rest, crates: --except scx-surface scx-mass scx-ssi scx-record }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pin # the pin check and scx-bench's tests link it
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask tests ${{ matrix.crates }}

  xplat:
    name: xplat (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: wasm32-wasip1, os: ubuntu-24.04, target: wasm32-wasip1 }
          - { name: aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pin # cargo loads every member's manifest, scx-difftest's too
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'wasm32-wasip1'
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Golden hash tests
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --target ${{ matrix.target }} -p scx-num --test fmath_pin -p scx-algo --test xplat_pin
      - name: scx-num and scx-algo unit tests # their dev-dependencies are built for the pins already
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test --target ${{ matrix.target }} -p scx-num -p scx-algo --lib

  difftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: difftest
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p scx-difftest
      - run: cargo test -p scx-testkit --test nurbs -- --ignored # the full sweeps `tests` skips

  bench-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: test -d crates/scx-bench && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.yes == 'true'
        uses: ./.github/actions/pin # scx-bench links the pin, as scx-difftest does
      - if: steps.has.outputs.yes == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.has.outputs.yes == 'true'
        run: cargo check --benches -p scx-bench
