# Written for solidcorex. The workspace: libraries bottom to top as `layers.txt` lists them.
[workspace]
resolver = "2"
members = [
    "crates/scx-num",
    "crates/scx-nurbs",
    "crates/scx-algo",
    "crates/scx-p21",
    "crates/scx-nurbs-surface",
    "crates/scx-testkit",
    "crates/scx-difftest",
    "crates/scx-bench",
    "xtask",
]
# scx-difftest and scx-bench link the pinned solidcore and are built only when asked for
# (`-p scx-difftest`, `-p scx-bench`).
default-members = [
    "crates/scx-num",
    "crates/scx-nurbs",
    "crates/scx-algo",
    "crates/scx-p21",
    "crates/scx-nurbs-surface",
    "crates/scx-testkit",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
rust-version = "1.85"
publish = false

# Mirrors solidcore's workspace lints at the pinned commit; the brief's denials
# (unsafe, unwrap, expect, panic, unchecked indexing) are among them. `cargo xtask fast`
# runs clippy with `-D warnings`, so every `warn` here fails the check.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "allow"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
or_fun_call = "warn"
# Research 62 D14: an error stays off the success path's size. Clippy's default threshold
# (128 bytes); a cause field holding a lower error boxes it.
result_large_err = "warn"
float_cmp = "allow"
many_single_char_names = "allow"
similar_names = "allow"
unreadable_literal = "allow"
excessive_precision = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
manual_midpoint = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
assert_is_empty = "allow"

# The truth references do exact big-integer arithmetic: unoptimised, their tests take
# minutes; optimised, seconds. Only this crate, so every other build is unchanged.
[profile.dev.package.scx-testkit]
opt-level = 3
