# Written for solidcorex: solidcore's settings at the pinned commit.
# Tests may use unwrap/expect/panic/indexing; library code may not (see [workspace.lints]).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
doc-valid-idents = ["SMLib", "NLib", "NVIDIA", "SolidCraft", "OpenUSD", ".."]

# docs/01-architecture.md §8.3. The platform's transcendental functions differ between
# systems: `scx_num::fmath` replaces them, the same bits everywhere; f32 ones too, and the
# `algebraic_*` methods, which are fast-math on stable Rust. HashMap iteration,
# the sort tie-break and `partial_cmp` on floats are for an xtask scan: a clippy ban on
# `PartialOrd::partial_cmp` also fires inside `#[derive(PartialOrd)]` (the unit newtypes).
disallowed-methods = [
    { path = "f64::mul_add", reason = "eft only: FMA must be explicit (01 §8.3)" },
    { path = "f64::powi", reason = "libm differs between platforms: use scx_num::fmath::powi (01 §8.3)" },
    { path = "f64::powf", reason = "libm differs between platforms: use scx_num::fmath::powf (01 §8.3)" },
    { path = "f64::exp", reason = "libm differs between platforms: use scx_num::fmath::exp (01 §8.3)" },
    { path = "f64::exp2", reason = "libm differs between platforms: use scx_num::fmath::exp2 (01 §8.3)" },
    { path = "f64::ln", reason = "libm differs between platforms: use scx_num::fmath::ln (01 §8.3)" },
    { path = "f64::log2", reason = "libm differs between platforms: use scx_num::fmath::log2 (01 §8.3)" },
    { path = "f64::log10", reason = "libm differs between platforms: use scx_num::fmath::log10 (01 §8.3)" },
    { path = "f64::sin", reason = "libm differs between platforms: use scx_num::fmath::sin (01 §8.3)" },
    { path = "f64::cos", reason = "libm differs between platforms: use scx_num::fmath::cos (01 §8.3)" },
    { path = "f64::sin_cos", reason = "libm differs between platforms: use scx_num::fmath::sin_cos (01 §8.3)" },
    { path = "f64::tan", reason = "libm differs between platforms: use scx_num::fmath::tan (01 §8.3)" },
    { path = "f64::asin", reason = "libm differs between platforms: use scx_num::fmath::asin (01 §8.3)" },
    { path = "f64::acos", reason = "libm differs between platforms: use scx_num::fmath::acos (01 §8.3)" },
    { path = "f64::atan", reason = "libm differs between platforms: use scx_num::fmath::atan (01 §8.3)" },
    { path = "f64::atan2", reason = "libm differs between platforms: use scx_num::fmath::atan2 (01 §8.3)" },
    { path = "f64::sinh", reason = "libm differs between platforms: use scx_num::fmath::sinh (01 §8.3)" },
    { path = "f64::cosh", reason = "libm differs between platforms: use scx_num::fmath::cosh (01 §8.3)" },
    { path = "f64::tanh", reason = "libm differs between platforms: use scx_num::fmath::tanh (01 §8.3)" },
    { path = "f64::hypot", reason = "libm differs between platforms: use scx_num::fmath::hypot (01 §8.3)" },
    { path = "f64::cbrt", reason = "libm differs between platforms: use scx_num::fmath::cbrt (01 §8.3)" },
    { path = "f64::log", reason = "libm differs between platforms: use scx_num::fmath::ln(x) / ln(base) (01 §8.3)" },
    { path = "f64::exp_m1", reason = "libm differs between platforms, and scx_num::fmath has no exp_m1 yet (01 §8.3)" },
    { path = "f64::ln_1p", reason = "libm differs between platforms, and scx_num::fmath has no ln_1p yet (01 §8.3)" },
    { path = "f64::asinh", reason = "libm differs between platforms, and scx_num::fmath has no asinh yet (01 §8.3)" },
    { path = "f64::acosh", reason = "libm differs between platforms, and scx_num::fmath has no acosh yet (01 §8.3)" },
    { path = "f64::atanh", reason = "libm differs between platforms, and scx_num::fmath has no atanh yet (01 §8.3)" },
    { path = "f64::algebraic_add", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f64::algebraic_sub", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f64::algebraic_mul", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f64::algebraic_div", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f64::algebraic_rem", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f32::mul_add", reason = "FMA must be explicit, in f64 through scx_num::eft (01 §8.3)" },
    { path = "f32::powi", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::powf", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::exp", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::exp2", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::exp_m1", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::ln", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::ln_1p", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::log", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::log2", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::log10", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::sin", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::cos", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::sin_cos", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::tan", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::asin", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::acos", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::atan", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::atan2", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::sinh", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::cosh", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::tanh", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::asinh", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::acosh", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::atanh", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::hypot", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::cbrt", reason = "libm differs between platforms: compute in f64 with scx_num::fmath (01 §8.3)" },
    { path = "f32::algebraic_add", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f32::algebraic_sub", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f32::algebraic_mul", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f32::algebraic_div", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
    { path = "f32::algebraic_rem", reason = "lets LLVM reassociate and fuse, so bits differ between targets: use the plain operator (01 §8.3)" },
]
disallowed-types = [
    { path = "std::collections::hash_map::DefaultHasher", reason = "seeded per process: use scx_num::hash (tests only)" },
    { path = "std::hash::RandomState", reason = "seeded per process: use scx_num::hash::FixedState (tests only)" },
    { path = "std::cell::Cell", reason = "not Sync: use a OnceLock cell (01 §8.3)" },
    { path = "std::cell::RefCell", reason = "not Sync: use a OnceLock cell (01 §8.3)" },
    { path = "std::time::Instant", reason = "a result must not depend on time (tests only)" },
    { path = "std::time::SystemTime", reason = "a result must not depend on time (tests only)" },
]
disallowed-macros = [
    { path = "std::thread_local", reason = "per-thread state breaks determinism across executors (01 §8.3)" },
]
